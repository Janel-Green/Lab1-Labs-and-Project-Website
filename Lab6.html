<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
</head>
    <style>
        *{
            margin:0;
            box-sizing: border-box;
        }
        .flex-parent{
            border: 1px solid; 
            display: flex;
            height: 100vh;
            align-items:center;
            justify-content: space-evenly;
            flex-direction: row;
            background: pink;
        }
        
        
        .child1{
            min-height: 50px;
            border: 1px solid; 
            display: flex;
            
        }
        .child2{
            min-height: 100px;
            border: 1px solid; 
            display: flex;
            
        }
        

    </style>
<body>
    <div class="flex-parent">
        <img src="https://picsum.photos/200/200?random=1" alt="random pic">
        <img src="https://picsum.photos/300/300?random=2" alt="random pic">
    <div class="child2">
        <img src="https://picsum.photos/200/200?random=3" alt="random pic"></body>
</html>
